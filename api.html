<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V2X 데이터 진단 모드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; font-family: 'Noto Sans KR', sans-serif; color: white; }
        .mono { font-family: 'Space Mono', monospace; }
        .card-bg { background: linear-gradient(145deg, #111 0%, #0d0d0d 100%); border: 1px solid rgba(255,255,255,0.06); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-waiting { background-color: #374151; }
        .dot-success { background-color: #10b981; box-shadow: 0 0 6px #10b981aa; }
        .dot-error   { background-color: #ef4444; box-shadow: 0 0 6px #ef4444aa; }
        #timer { font-family: 'Space Mono', monospace; transition: color 0.4s ease; }
        @keyframes pulse-ring { 0%, 100% { opacity: 0.15; transform: scale(0.95); } 50% { opacity: 0.35; transform: scale(1.02); } }
        #glow { animation: pulse-ring 3s ease-in-out infinite; }
        .log-item { border-left: 2px solid #1e293b; padding-left: 8px; font-family: 'Space Mono', monospace; font-size: 9px; margin-bottom: 2px; }
        #timestamp.estimated { color: #fbbf24; }
        #itstNmDisplay.estimated { color: #fbbf24; }
    </style>
</head>
<body class="max-w-[480px] mx-auto h-[100dvh] flex flex-col overflow-hidden">

    <div class="flex items-center gap-2 px-4 py-2.5 bg-neutral-950 border-b border-white/[0.07] shrink-0">
        <span class="material-symbols-rounded text-blue-400 text-[20px]">analytics</span>
        <span class="text-[11px] font-bold uppercase tracking-widest text-neutral-300">V2X Diagnostic</span>
        <div class="flex-1"></div>
        <button id="debugToggle" class="flex items-center gap-1 text-[10px] px-2 py-1 rounded-lg border border-white/10 text-neutral-500">
            <span class="material-symbols-rounded text-[16px]">bug_report</span><span>Debug</span>
        </button>
        <a href="index.html" class="text-[10px] px-2.5 py-1 rounded-lg bg-neutral-800 border border-white/10 text-neutral-400 ml-1">AI 모드</a>
    </div>

    <main class="flex-1 overflow-y-auto p-4 space-y-3">

        <!-- ① 신호 카드 (항상 표시) -->
        <div id="signalCard" class="card-bg rounded-3xl p-6 flex flex-col items-center relative overflow-hidden">
            <div id="itstNmDisplay" class="text-[22px] font-black text-white text-center leading-tight min-h-[1.4em]">교차로 대기 중</div>
            <div id="directionBadge" class="mt-1 mb-2 h-5 text-[14px] font-bold text-blue-400 tracking-widest"></div>
            <div id="timer" class="text-[84px] font-black leading-none tabular-nums text-neutral-800">--</div>
            <div id="timestamp" class="text-[10px] text-neutral-600 mono mt-2 tracking-[0.3em]">time</div>
            <div id="statusText" class="text-sm font-bold text-neutral-600 mt-3">수신 대기 중</div>
            <div id="glow" class="absolute inset-0 pointer-events-none"></div>
        </div>

        <!-- ② GPS / 주소 / 나침반 (항상 표시) -->
        <div class="card-bg rounded-2xl p-4 space-y-3">
            <div class="flex items-start gap-3">
                <span class="material-symbols-rounded text-blue-400 text-[20px]">my_location</span>
                <div class="min-w-0 flex-1">
                    <p class="text-[9px] text-neutral-500 font-bold uppercase tracking-widest">Current Location</p>
                    <p id="geoCoords" class="mono text-[11px] text-blue-300">Lat: -- / Lng: --</p>
                    <p id="geoAddress" class="text-sm font-medium text-neutral-200 truncate mt-1">주소 확인 중...</p>
                </div>
            </div>
            <div class="flex items-center gap-3 border-t border-white/[0.06] pt-3">
                <span class="material-symbols-rounded text-amber-400 text-[20px]">explore</span>
                <div>
                    <p class="text-[9px] text-neutral-500 font-bold uppercase tracking-widest">Compass Heading</p>
                    <p id="headingInfo" class="mono text-sm font-bold text-amber-200">0° (N/A)</p>
                </div>
            </div>
        </div>

        <!-- ③ Pipeline Status (Debug에서만) -->
        <div id="pipelinePanel" class="hidden card-bg rounded-2xl p-4 space-y-2.5">
            <h3 class="text-[9px] font-black text-neutral-600 uppercase tracking-widest">Pipeline Status</h3>
            <div class="flex justify-between items-center text-[12px]">
                <div class="flex items-center gap-2"><div id="step-gps" class="status-dot dot-waiting"></div><span>Step 1 — GPS 수신</span></div>
                <span id="step-gps-val" class="mono text-[10px]">Wait</span>
            </div>
            <div class="flex justify-between items-center text-[12px]">
                <div class="flex items-center gap-2"><div id="step-nearby" class="status-dot dot-waiting"></div><span>Step 2 — 교차로 매칭</span></div>
                <span id="step-nearby-val" class="mono text-[10px]">Wait</span>
            </div>
            <div class="flex justify-between items-center text-[12px]">
                <div class="flex items-center gap-2"><div id="step-signal" class="status-dot dot-waiting"></div><span>Step 3 — 데이터 수신</span></div>
                <span id="step-signal-val" class="mono text-[10px]">Wait</span>
            </div>
            <div class="flex justify-between items-center text-[12px]">
                <div class="flex items-center gap-2"><div id="step-plan" class="status-dot dot-waiting"></div><span>Step 4 — 경찰청 계획 예측</span></div>
                <span id="step-plan-val" class="mono text-[10px]">-</span>
            </div>
        </div>

        <!-- ④ Raw Data Monitor (Debug에서만) -->
        <div id="debugPanel" class="hidden card-bg rounded-2xl p-3 border border-amber-400/20 space-y-2">
            <div class="text-[9px] font-black text-amber-400 uppercase tracking-widest">Raw Data Monitor</div>
            <div id="debugContent" class="text-[9px] text-neutral-500 space-y-0.5"></div>
        </div>

        <!-- ⑤ 로그 콘솔 (Debug에서만) -->
        <div id="logPanel" class="hidden">
            <div class="rounded-xl p-3 bg-black border border-neutral-900 h-24 overflow-y-auto" id="logConsole"></div>
        </div>

    </main>

    <div class="p-4 bg-neutral-950 border-t border-white/[0.07] shrink-0">
        <button id="startBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-900/30 transition-all active:scale-[0.98]">
            진단 시작
        </button>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=ed22d5504be53d988c4ba7fecd99a7b2&libraries=services"></script>
    <script src="api.js"></script>
</body>
</html>
