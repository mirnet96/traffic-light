<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V2X 데이터 진단 모드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=ed22d5504be53d988c4ba7fecd99a7b2&libraries=services"></script>
    <style>
        body { background-color: #000; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-waiting { background-color: #4b5563; }
        .dot-success { background-color: #10b981; shadow: 0 0 10px #10b981; }
        .dot-error { background-color: #ef4444; }
        .log-item { border-left: 2px solid #334155; padding-left: 8px; margin-bottom: 4px; font-family: monospace; font-size: 10px; }
    </style>
</head>
<body class="bg-black text-white font-sans max-w-[480px] mx-auto h-[100dvh] flex flex-col overflow-hidden">

    <div class="flex items-center gap-1.5 px-3 py-2 bg-neutral-900 border-b border-white/10 shrink-0">
        <span class="material-symbols-rounded text-blue-400">analytics</span>
        <span class="text-xs font-bold uppercase tracking-wider">V2X Diagnostic Mode</span>
        <div class="flex-1"></div>
        <a href="index.html" class="text-[11px] px-2 py-1 rounded bg-neutral-800 border border-white/10 text-neutral-400">AI 모드 전환</a>
    </div>

    <main class="flex-1 overflow-y-auto p-4 space-y-4">
        
        <div id="signalCard" class="bg-neutral-900 rounded-3xl p-6 border border-white/5 flex flex-col items-center relative overflow-hidden">
            <div id="timer" class="text-8xl font-black tabular-nums text-neutral-800 transition-colors">--</div>
            <div id="statusText" class="text-sm font-bold text-neutral-600 mt-2">수신 대기 중</div>
            <div id="glow" class="absolute inset-0 opacity-5 pointer-events-none"></div>
        </div>

        <div class="bg-neutral-900 rounded-2xl p-4 border border-white/5 space-y-3">
            <div class="flex items-start gap-3">
                <span class="material-symbols-rounded text-blue-400 mt-0.5">my_location</span>
                <div class="min-w-0 flex-1">
                    <p class="text-[10px] text-neutral-500 font-bold uppercase">Current Location</p>
                    <p id="geoCoords" class="text-xs font-mono text-blue-300">Lat: -- / Lng: --</p>
                    <p id="geoAddress" class="text-sm font-medium mt-1 text-neutral-200 truncate">주소를 불러오는 중...</p>
                </div>
            </div>
            <div class="flex items-center gap-3 border-t border-white/5 pt-3">
                <span class="material-symbols-rounded text-amber-400">explore</span>
                <div>
                    <p class="text-[10px] text-neutral-500 font-bold uppercase">Compass Heading</p>
                    <p id="headingInfo" class="text-sm font-mono font-bold text-amber-200">0° (탐색 전)</p>
                </div>
            </div>
        </div>

        <div class="bg-neutral-900 rounded-2xl p-4 border border-white/5 space-y-4">
            <h3 class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">Connection Pipeline</h3>
            
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div id="step-gps" class="status-dot dot-waiting"></div>
                        <span class="text-xs">Step 1: GPS 위경도 수신</span>
                    </div>
                    <span id="step-gps-val" class="text-[10px] text-neutral-500">Wait</span>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div id="step-nearby" class="status-dot dot-waiting"></div>
                        <span class="text-xs">Step 2: 주변 교차로 매칭</span>
                    </div>
                    <span id="step-nearby-val" class="text-[10px] text-neutral-500">Wait</span>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div id="step-signal" class="status-dot dot-waiting"></div>
                        <span class="text-xs">Step 3: 실시간 신호 응답</span>
                    </div>
                    <span id="step-signal-val" class="text-[10px] text-neutral-500">Wait</span>
                </div>
            </div>
        </div>

        <div class="bg-black rounded-xl p-3 border border-neutral-800 h-32 overflow-y-auto" id="logConsole">
            <div class="text-[9px] text-blue-500 font-bold mb-2 uppercase">[System Log]</div>
        </div>

    </main>

    <div class="p-4 bg-neutral-900 border-t border-white/10 shrink-0">
        <button id="startBtn" class="w-full bg-blue-600 py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-900/40">진단 시작</button>
    </div>

    <script src="api.js"></script>
</body>
</html>
