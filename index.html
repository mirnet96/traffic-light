<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>ULTRA VISION AI - Dynamic ROI & V2X (Improved)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <!--
        [FIX] @mediapipe/pose 제거 — 실제로 사용되지 않던 미사용 번들
        [NEW] @mediapipe/tasks-vision 추가 — ImageClassifier 사용을 위한 SDK
              vision.js에서 동적 import로 로드하므로 여기서는 선언만 유지
    -->

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=3696a1a72981f0d97505a7dc983c1d39&libraries=services"></script>

    <style>
        .h-safe { height: 100dvh; }
        .tab-content { display: none; height: calc(100% - 140px); position: relative; overflow-y: auto; }
        .tab-content.active { display: block !important; }
        #vision-tab { overflow: hidden; }
        #webcam {
            position: absolute;
            width: 1px; height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #roi-fullscreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #preview-canvas, #roi-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #roi-canvas { object-fit: contain; display: block; opacity: 0.5; border: 2px solid rgba(255, 255, 0, 0.8); z-index: 5; pointer-events: none;}
        #color-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 10; }
        #status-bar { position: absolute; bottom: 40px; left: 0; width: 100%; text-align: center; z-index: 20; pointer-events: none; }
        #status-main { font-size: 56px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 4px 20px rgba(0,0,0,0.9); transition: color 0.3s ease, text-shadow 0.3s ease; }
        #status-sub { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.6); letter-spacing: 2px; margin-top: 8px; }
        #top-label { position: absolute; top: 12px; left: 16px; font-size: 11px; font-weight: 900; color: rgba(255,255,255,0.4); letter-spacing: 2px; z-index: 20; pointer-events: none; }
        /* MediaPipe 분류기 상태 배지 */
        #mp-badge { position: absolute; top: 12px; right: 16px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 99px; z-index: 20; pointer-events: none; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.35); letter-spacing: 1px; }
        #data-tab::-webkit-scrollbar { display: none; }

        /* 진단 배너 */
        #diag-banner { display:none; position:fixed; bottom:0; left:0; right:0; background:rgba(220,38,38,0.95); color:#fff; font-size:11px; font-weight:700; padding:10px 16px; z-index:9999; word-break:break-all; }
    </style>
</head>
<body class="bg-[#050505] text-white overflow-hidden select-none">
<div id="app" class="relative h-safe flex flex-col">

    <nav class="flex bg-[#111] pt-12 border-b border-white/10 z-50">
        <button id="tab-v-btn"
                class="flex-1 py-4 font-black text-blue-400 border-b-4 border-blue-500 transition-all"
                onclick="if(window.__switchTab) window.__switchTab('vision')">VISION AI</button>
        <button id="tab-d-btn"
                class="flex-1 py-4 font-black text-zinc-500 border-b-4 border-transparent transition-all"
                onclick="if(window.__switchTab) window.__switchTab('data')">V2X DATA</button>
    </nav>

    <div id="vision-tab" class="tab-content active">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="roi-fullscreen">
            <canvas id="preview-canvas"></canvas>
            <canvas id="roi-canvas"></canvas>
            <div id="color-overlay"></div>
            <div id="top-label">AI REAL-TIME DYNAMIC ROI ANALYSIS (IMPROVED FILTERS)</div>
            <!-- [NEW] MediaPipe 분류기 로드 상태 배지 -->
            <div id="mp-badge">MP LOADING</div>
            <div id="status-bar">
                <div id="status-main" style="color:#71717a;">READY</div>
                <div id="status-sub">개선된 필터로 신호등을 찾고 있습니다</div>
            </div>
        </div>
    </div>

    <div id="data-tab" class="tab-content p-6 bg-[#0a0a0a] space-y-4">
        <div id="api-card" class="bg-zinc-900 rounded-[40px] p-8 border-l-[12px] border-zinc-700 shadow-2xl">
            <div class="flex justify-between items-start mb-2">
                <h1 id="cross-name" class="text-2xl font-black italic tracking-tighter text-zinc-300 uppercase">Searching...</h1>
                <span id="api-detailed-status" class="text-[10px] font-bold px-2 py-1 rounded bg-white/5 text-zinc-500">IDLE</span>
            </div>
            <div class="py-6">
                <div id="api-status-text-data" class="text-7xl font-black text-zinc-800 text-center tracking-tighter leading-none">READY</div>
                <div id="api-error-msg" class="text-center text-red-500 text-xs mt-4 font-bold hidden"></div>
            </div>
            <button id="refresh-api" class="w-full py-4 bg-white/5 rounded-2xl text-[10px] font-bold uppercase text-zinc-500 hover:bg-white/10 active:scale-95 transition-transform">Manual Refresh</button>
        </div>
        <div class="bg-zinc-900 rounded-3xl p-5 border border-white/5 shadow-xl space-y-3">
            <div class="flex justify-between items-end border-b border-white/5 pb-2">
                <div class="flex-1 pr-4">
                    <div class="text-[9px] uppercase font-black text-zinc-500 mb-1">Current Address</div>
                    <div id="address-text" class="text-sm font-bold text-white leading-tight">주소를 불러오는 중...</div>
                </div>
                <div class="text-right">
                    <div id="location-text" class="text-[9px] font-mono text-blue-400 italic">0.0000, 0.0000</div>
                </div>
            </div>
            <div id="map" style="width:100%; height:220px; border-radius:1.5rem; background:#111;"></div>
        </div>
    </div>

    <div id="boot-screen" class="absolute inset-0 bg-[#050505] z-[100] flex items-center justify-center p-6 transition-opacity duration-500">
        <div class="bg-zinc-900 w-full max-w-sm p-10 rounded-[50px] text-center shadow-2xl border border-white/5">
            <h1 class="text-4xl font-black mb-10 italic tracking-tighter uppercase text-white">Ultra Vision</h1>
            <div id="https-warning" class="hidden mb-6 bg-red-900/50 border border-red-500/50 rounded-2xl p-4 text-left">
                <p class="text-red-400 text-xs font-bold mb-1">⚠️ HTTPS 필요</p>
                <p class="text-red-300 text-[10px] leading-relaxed">iOS Safari에서 카메라를 사용하려면 HTTPS 연결이 필요합니다.</p>
            </div>

            <button id="start-btn"
                    class="w-full py-6 bg-blue-600 hover:bg-blue-500 active:scale-95 rounded-[30px] font-black text-xl transition-all shadow-[0_0_30px_rgba(37,99,235,0.4)]">
                SYSTEM START
            </button>

            <p class="text-zinc-500 text-[10px] mt-6 font-bold uppercase tracking-widest">Powered by AI & V2X Data</p>
            <p class="text-zinc-600 text-[9px] mt-2">카메라 사용에는 HTTPS 또는 localhost 환경이 필요합니다</p>
            <div id="boot-diag" class="mt-4 text-[9px] text-zinc-600 font-mono text-left leading-relaxed"></div>
        </div>
    </div>

</div>

<div id="diag-banner"></div>

<script>
    (function() {
        const diag = document.getElementById('boot-diag');
        const warn = document.getElementById('https-warning');

        const isSecure = location.protocol === 'https:'
            || location.hostname === 'localhost'
            || location.hostname === '127.0.0.1';

        if (!isSecure && warn) warn.classList.remove('hidden');

        const info = [
            'HTTPS: '    + (isSecure ? '✅' : '❌'),
            'Camera: '   + (!!navigator.mediaDevices ? '✅' : '❌'),
            'Worker: '   + (!!window.Worker ? '✅' : '❌'),
            'Bitmap: '   + (!!window.createImageBitmap ? '✅' : '❌'),
            'Offscreen: '+ (!!window.OffscreenCanvas ? '✅' : '❌'),
            'Module: '   + (document.createElement('script').noModule !== undefined ? '✅' : '?'),
        ];
        if (diag) diag.innerText = info.join('  ');

        window.addEventListener('error', (e) => {
            const b = document.getElementById('diag-banner');
            if (b) { b.style.display = 'block'; b.innerText = '❌ ' + e.message + ' (' + (e.filename||'').split('/').pop() + ':' + e.lineno + ')'; }
        });
        window.addEventListener('unhandledrejection', (e) => {
            const b = document.getElementById('diag-banner');
            if (b) { b.style.display = 'block'; b.innerText = '❌ Promise: ' + (e.reason?.message || String(e.reason)); }
        });
    })();
</script>

<script type="module" src="app.js?v=3"></script>
</body>
</html>
