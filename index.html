<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>보행 신호 알리미</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-black text-white font-sans max-w-[480px] mx-auto h-[100dvh] flex flex-col overflow-hidden">

  <!-- 상단 바 -->
  <div id="topbar" class="flex items-center gap-1.5 px-2.5 py-2 bg-black/85 border-b border-white/10 shrink-0 min-w-0">
    <svg class="w-[18px] h-6 shrink-0" viewBox="0 0 22 28" fill="none">
      <rect x="3" y="0" width="16" height="28" rx="5" fill="#222"/>
      <circle cx="11" cy="8" r="5" fill="#ff2200"/>
      <circle cx="11" cy="20" r="5" fill="#00ee44"/>
    </svg>
    <span class="text-[13px] font-medium whitespace-nowrap">보행 신호 알리미</span>
    <span id="badge-ai" class="text-[11px] px-2 py-0.5 rounded-md bg-black/60 text-yellow-400 whitespace-nowrap shrink-0">대기</span>
    <span id="badge-scan" style="display:none"
      class="text-[11px] px-2 py-0.5 rounded-md bg-blue-900/60 text-blue-300 whitespace-nowrap shrink-0 scan-pulse">탐색 중</span>
    <div class="flex-1"></div>
    <button id="btn-night"
      class="flex items-center gap-1 text-[11px] px-2 py-1 rounded-md bg-neutral-800 text-neutral-400 transition-colors whitespace-nowrap shrink-0">
      <span class="material-symbols-rounded text-sm leading-none">dark_mode</span>
      <span id="night-label">야간</span>
    </button>
    <button id="btn-flip" style="display:none"
      class="items-center justify-center w-8 h-8 rounded-md bg-neutral-900 text-neutral-400 transition-colors shrink-0">
      <span class="material-symbols-rounded text-sm leading-none">flip_camera_ios</span>
    </button>
  </div>

  <!-- 카메라 뷰 -->
  <div id="viewbox" class="relative flex-1 min-h-0 bg-black overflow-hidden">
    <video id="video" class="w-full h-full object-cover block day" playsinline muted autoplay></video>
    <canvas id="proc" style="display:none"></canvas>
    <canvas id="overlay" class="absolute inset-0 w-full h-full pointer-events-none object-cover"></canvas>
    <div id="scanline" style="display:none"
      class="absolute left-0 right-0 h-0.5 bg-blue-400/50"></div>

    <!-- PiP 스캔 미리보기 -->
    <canvas id="pip" class="pip-canvas" style="display:none"></canvas>

    <!-- ══════════════════════════════
         초기 화면 (설정 포함)
    ══════════════════════════════ -->
    <div id="init-screen" class="absolute inset-0 flex flex-col items-center justify-center gap-4 px-6 overflow-y-auto py-6">

      <!-- 신호등 아이콘 -->
      <svg width="60" height="132" viewBox="0 0 72 160" class="shrink-0">
        <rect x="4" y="0" width="64" height="160" rx="12" fill="#1a1a1a"/>
        <rect x="4" y="0" width="64" height="160" rx="12" fill="none" stroke="#333" stroke-width="1.5"/>
        <circle cx="36" cy="44"  r="22" fill="#ff2200"/>
        <g transform="translate(36,44)" fill="#330000">
          <ellipse cx="0" cy="-7" rx="5" ry="6"/>
          <ellipse cx="-5" cy="2" rx="4" ry="6"/>
          <ellipse cx="5"  cy="2" rx="4" ry="6"/>
          <rect x="-3" y="2" width="6" height="8" rx="1"/>
          <rect x="-1.5" y="9" width="3" height="5" rx="1"/>
          <rect x="1.5"  y="9" width="3" height="5" rx="1"/>
        </g>
        <circle cx="36" cy="116" r="22" fill="#1a3a1a"/>
      </svg>

      <!-- 숨김 체크박스 (settings.js가 읽음) -->
      <input type="checkbox" id="cfg-tts" checked style="display:none">
      <input type="checkbox" id="cfg-debug" style="display:none">
      <input type="checkbox" id="cfg-rec" style="display:none">

      <!-- ── 설정 카드 ── -->
      <div style="width:100%;max-width:360px;background:#171717;border-radius:16px;border:1px solid rgba(255,255,255,0.1);overflow:hidden;">

        <!-- 음성 알림 -->
        <div onclick="toggleCfg('cfg-tts')"
          style="display:flex;flex-direction:row;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;">
          <span class="material-symbols-rounded" style="font-size:20px;color:#60a5fa;flex-shrink:0;">volume_up</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:500;color:#fff;">음성 알림</div>
            <div style="font-size:11px;color:#737373;">신호 감지 시 TTS로 안내</div>
          </div>
          <div id="cfg-tts-track" style="position:relative;width:44px;height:26px;border-radius:999px;background:#2563eb;flex-shrink:0;transition:background .2s;">
            <div id="cfg-tts-thumb" style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;transform:translateX(18px);box-shadow:0 1px 3px rgba(0,0,0,.4);"></div>
          </div>
        </div>

        <div style="height:1px;background:rgba(255,255,255,0.06);margin:0 16px;"></div>

        <!-- 디버그 로그 -->
        <div onclick="toggleCfg('cfg-debug')"
          style="display:flex;flex-direction:row;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;">
          <span class="material-symbols-rounded" style="font-size:20px;color:#737373;flex-shrink:0;">bug_report</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:500;color:#fff;">디버그 로그</div>
            <div style="font-size:11px;color:#737373;">화면 상단에 로그 표시</div>
          </div>
          <div id="cfg-debug-track" style="position:relative;width:44px;height:26px;border-radius:999px;background:#3a3a3a;flex-shrink:0;transition:background .2s;">
            <div id="cfg-debug-thumb" style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;transform:translateX(0);box-shadow:0 1px 3px rgba(0,0,0,.4);"></div>
          </div>
        </div>

        <div style="height:1px;background:rgba(255,255,255,0.06);margin:0 16px;"></div>

        <!-- 디버그 녹화 -->
        <div onclick="toggleCfg('cfg-rec')"
          style="display:flex;flex-direction:row;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;">
          <span class="material-symbols-rounded" style="font-size:20px;color:#f87171;flex-shrink:0;">videocam</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:500;color:#fff;">디버그 녹화</div>
            <div style="font-size:11px;color:#737373;">카메라 영상을 파일로 저장</div>
          </div>
          <div id="cfg-rec-track" style="position:relative;width:44px;height:26px;border-radius:999px;background:#3a3a3a;flex-shrink:0;transition:background .2s;">
            <div id="cfg-rec-thumb" style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;transform:translateX(0);box-shadow:0 1px 3px rgba(0,0,0,.4);"></div>
          </div>
        </div>
      </div>



      <!-- 시작 버튼 -->
      <button id="btn-start"
        class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all rounded-xl px-9 py-3.5 text-base font-medium flex items-center gap-2 w-full max-w-sm justify-center">
        <span class="material-symbols-rounded text-xl leading-none">videocam</span>
        카메라 시작
      </button>

      <p class="text-neutral-600 text-[12px] text-center leading-relaxed">
        카메라를 길 건너편 신호등에 향하면<br>자동으로 감지 및 확대합니다
      </p>
    </div>

    <!-- 로딩 화면 -->
    <div id="loading-screen" style="display:none"
      class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-black/80">
      <div class="spinner"></div>
      <p id="load-msg" class="text-neutral-400 text-sm">로드 중...</p>
    </div>

    <!-- 오류 화면 -->
    <div id="error-screen" style="display:none"
      class="absolute inset-0 flex flex-col items-center justify-center gap-4 px-6">
      <div class="w-10 h-10 rounded-full bg-red-500 flex items-center justify-center">
        <span class="material-symbols-rounded text-white text-xl leading-none">error</span>
      </div>
      <p id="err-msg" class="text-red-400 text-sm text-center"></p>
      <button id="btn-retry"
        class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all rounded-xl px-7 py-3 text-sm flex items-center gap-2">
        <span class="material-symbols-rounded text-base leading-none">refresh</span>
        다시 시도
      </button>
    </div>
  </div>

  <!-- 하단 감지 결과 -->
  <div id="bottombar" style="display:none"
    class="bg-black/90 border-t border-white/10 px-3.5 py-3 shrink-0">
    <div id="det-empty"
      class="text-center text-neutral-600 text-[13px] py-1 flex items-center justify-center gap-1.5">
      <span class="material-symbols-rounded text-base leading-none">radar</span>
      <span class="scan-msg-text">신호등을 탐색 중입니다...</span>
    </div>
    <div id="det-list" class="flex gap-2.5 overflow-x-auto"></div>
  </div>

  <!-- 전체화면 오버레이 -->
  <div id="fs" class="fixed inset-0 z-[9999] flex-col items-center justify-center cursor-pointer"
    style="display:none">
    <div id="fs-circle" class="rounded-full flex items-center justify-center">
      <svg id="fs-svg" viewBox="0 0 100 120"></svg>
    </div>
    <div id="fs-label" class="font-bold leading-none"></div>
    <div id="fs-sub" class="text-white/40"></div>
    <!-- 녹화 중 표시 -->
    <div id="fs-rec-badge" style="display:none"
      class="absolute top-5 left-5 flex items-center gap-1.5 bg-red-600/80 rounded-full px-3 py-1">
      <div class="w-2 h-2 rounded-full bg-white rec-blink"></div>
      <span class="text-[12px] font-medium">REC</span>
    </div>
    <div class="absolute top-5 right-5 text-white/40">
      <span class="material-symbols-rounded text-2xl leading-none">close</span>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
