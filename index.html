<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>신호등 확대기</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white font-sans max-w-[480px] mx-auto min-h-screen flex flex-col overflow-hidden">

  <!-- 상단 바 -->
  <div id="topbar" class="flex items-center gap-2 px-3.5 py-2.5 bg-black/85 border-b border-white/10 shrink-0">
    <svg class="w-[22px] h-7 shrink-0" viewBox="0 0 22 28" fill="none">
      <rect x="3" y="0" width="16" height="28" rx="5" fill="#222"/>
      <circle cx="11" cy="8" r="4" fill="#ff2200"/>
      <circle cx="11" cy="20" r="4" fill="#00ee44"/>
    </svg>
    <span class="text-[15px] font-medium flex-1">신호등 확대기</span>
    <span id="badge-ai" class="text-[11px] px-2 py-0.5 rounded-md bg-black/60 text-yellow-400">대기</span>
    <button id="btn-night"
      class="flex items-center gap-1 text-[12px] px-2.5 py-1 rounded-md bg-neutral-800 text-neutral-400 transition-colors">
      <span class="material-symbols-rounded text-base leading-none">dark_mode</span>
      <span id="night-label">야간 OFF</span>
    </button>
    <button id="btn-flip"
      class="hidden flex items-center gap-1 text-[12px] px-2.5 py-1 rounded-md bg-neutral-900 text-neutral-400 transition-colors">
      <span class="material-symbols-rounded text-base leading-none">flip_camera_ios</span>
    </button>
  </div>

  <!-- 카메라 뷰 -->
  <div id="viewbox" class="relative flex-1 bg-black overflow-hidden">
    <video id="video" class="w-full h-full object-cover block" playsinline muted autoplay></video>
    <canvas id="proc" class="hidden"></canvas>
    <canvas id="overlay" class="absolute inset-0 w-full h-full pointer-events-none object-cover"></canvas>
    <div id="scanline" class="absolute left-0 right-0 h-0.5 bg-blue-400/50 hidden"></div>

    <!-- 초기 화면 -->
    <div id="init-screen" class="absolute inset-0 flex flex-col items-center justify-center gap-5 px-6">
      <div class="w-[72px] h-36 bg-neutral-900 rounded-xl flex flex-col items-center justify-around py-3.5">
        <div class="w-9 h-9 rounded-full bg-[#ff2200] shadow-[0_0_16px_#ff2200]"></div>
        <div class="w-9 h-9 rounded-full bg-neutral-700"></div>
      </div>
      <button id="btn-start"
        class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all rounded-xl px-9 py-3.5 text-base font-medium flex items-center gap-2">
        <span class="material-symbols-rounded text-xl leading-none">videocam</span>
        카메라 시작
      </button>
      <p class="text-neutral-600 text-[13px] text-center leading-relaxed">
        카메라를 길 건너편 신호등에 향하면<br>자동으로 감지 및 확대합니다
      </p>
    </div>

    <!-- 로딩 화면 -->
    <div id="loading-screen" class="absolute inset-0 hidden flex-col items-center justify-center gap-4 bg-black/80">
      <div class="spinner"></div>
      <p id="load-msg" class="text-neutral-400 text-sm">카메라 시작 중...</p>
    </div>

    <!-- 오류 화면 -->
    <div id="error-screen" class="absolute inset-0 hidden flex-col items-center justify-center gap-4 px-6">
      <div class="w-10 h-10 rounded-full bg-red-500 flex items-center justify-center">
        <span class="material-symbols-rounded text-white text-xl leading-none">error</span>
      </div>
      <p id="err-msg" class="text-red-400 text-sm text-center"></p>
      <button id="btn-retry"
        class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all rounded-xl px-7 py-3 text-sm flex items-center gap-2">
        <span class="material-symbols-rounded text-base leading-none">refresh</span>
        다시 시도
      </button>
    </div>
  </div>

  <!-- 하단 감지 결과 -->
  <div id="bottombar" class="hidden bg-black/90 border-t border-white/10 px-3.5 py-3 shrink-0">
    <div id="det-empty" class="text-center text-neutral-600 text-[13px] py-1 flex items-center justify-center gap-1.5">
      <span class="material-symbols-rounded text-base leading-none">radar</span>
      신호등을 탐색 중입니다...
    </div>
    <div id="det-list" class="flex gap-2.5 overflow-x-auto"></div>
  </div>

  <!-- 전체화면 오버레이 -->
  <div id="fs" class="fixed inset-0 z-[9999] hidden flex-col items-center justify-center cursor-pointer">
    <div id="fs-circle" class="rounded-full flex items-center justify-center">
      <svg id="fs-svg" viewBox="0 0 100 120"></svg>
    </div>
    <div id="fs-label" class="font-bold leading-none"></div>
    <div id="fs-sub" class="text-white/40"></div>
    <div class="absolute top-5 right-5 text-white/40">
      <span class="material-symbols-rounded text-2xl leading-none">close</span>
    </div>
  </div>

  <!-- TensorFlow.js (YOLOv8s 폴백용) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <!-- MediaPipe Tasks Vision (1차 감지) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>
  <!-- 감지 모듈 — 의존 순서 준수 -->
  <script src="detector.mediapipe.js"></script>
  <script src="detector.yolo.js"></script>
  <script src="detector.js"></script>
  <script src="renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
