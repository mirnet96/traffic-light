<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2X 원인 진단</title>
<style>
  body { background:#111; color:#eee; font-family:monospace; font-size:13px; padding:16px; }
  h2 { color:#60a5fa; margin-top:20px; }
  pre { background:#1e1e1e; padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-all; }
  button { background:#2563eb; color:#fff; border:none; padding:10px 20px; border-radius:8px; margin:6px 4px; font-size:13px; cursor:pointer; }
  .ok  { color:#34d399; }
  .err { color:#f87171; }
  .warn{ color:#fbbf24; }
</style>
</head>
<body>

<h2>🔍 V2X 원인 진단 도구</h2>
<p>아래 버튼을 순서대로 눌러 각 단계를 확인하세요.</p>

<button onclick="testGPS()">① GPS 테스트</button>
<button onclick="testKakao()">② Kakao SDK 테스트</button>
<button onclick="testCrossroadFile()">③ crossroads.json 확인</button>
<button onclick="testAPI()">④ API 직접 호출</button>
<button onclick="runAll()">▶ 전체 자동 실행</button>

<h2>① GPS</h2>
<pre id="gps-out">버튼을 누르세요...</pre>

<h2>② Kakao SDK 역지오코딩</h2>
<pre id="kakao-out">버튼을 누르세요...</pre>

<h2>③ crossroads.json (처음 20개)</h2>
<pre id="crossroad-out">버튼을 누르세요...</pre>

<h2>④ API 응답 (raw)</h2>
<pre id="api-out">버튼을 누르세요...</pre>

<!-- Kakao SDK -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=ed22d5504be53d988c4ba7fecd99a7b2&libraries=services"></script>

<script>
const AUTH_KEY = '7c76f496-b1f7-459f-85f1-ec9359276fce';
let savedLat = null, savedLng = null;

/* ① GPS */
function testGPS() {
  const el = document.getElementById('gps-out');
  el.innerHTML = '📡 GPS 수신 중...';
  if (!navigator.geolocation) {
    el.innerHTML = '<span class="err">❌ 이 기기는 GPS 미지원</span>';
    return;
  }
  navigator.geolocation.getCurrentPosition(pos => {
    savedLat = pos.coords.latitude;
    savedLng = pos.coords.longitude;
    el.innerHTML =
      `<span class="ok">✅ GPS 수신 성공</span>\n` +
      `Lat: ${savedLat.toFixed(7)}\nLng: ${savedLng.toFixed(7)}\n` +
      `정확도: ±${pos.coords.accuracy.toFixed(1)}m`;
  }, err => {
    el.innerHTML = `<span class="err">❌ GPS 실패: ${err.message} (code ${err.code})</span>`;
  }, { enableHighAccuracy: true, timeout: 10000 });
}

/* ② Kakao */
function testKakao() {
  const el = document.getElementById('kakao-out');
  if (typeof kakao === 'undefined' || !kakao.maps || !kakao.maps.services) {
    el.innerHTML =
      '<span class="err">❌ Kakao SDK 로드 실패\n' +
      '→ GitHub Pages 도메인이 Kakao 앱에 등록됐는지 확인하세요.\n' +
      '→ https://developers.kakao.com 에서 앱 → 플랫폼 → Web → 사이트 도메인 추가 필요</span>';
    return;
  }
  if (!savedLat) {
    el.innerHTML = '<span class="warn">⚠️ 먼저 ① GPS 테스트를 실행하세요</span>';
    return;
  }
  el.innerHTML = '🗺️ 역지오코딩 요청 중...';
  const gc = new kakao.maps.services.Geocoder();
  gc.coord2Address(savedLng, savedLat, (result, status) => {
    if (status === kakao.maps.services.Status.OK) {
      el.innerHTML =
        `<span class="ok">✅ 역지오코딩 성공</span>\n` +
        `주소: ${result[0].address.address_name}\n\n` +
        `raw:\n${JSON.stringify(result[0], null, 2)}`;
    } else {
      el.innerHTML = `<span class="err">❌ 역지오코딩 실패: status = ${status}</span>`;
    }
  });
}

/* ③ crossroads.json */
async function testCrossroadFile() {
  const el = document.getElementById('crossroad-out');
  el.innerHTML = '📂 파일 확인 중...';
  try {
    // 백엔드 API를 통해 crossroads 목록 확인 (별도 엔드포인트가 없으면 직접 파일 fetch)
    // 아래는 현재 GPS 위치 ±0.1° 범위 교차로를 API에서 확인
    const res = await fetch(
      `https://iot.klueware.com/api/v1/nearby?lat=${savedLat || 37.4967}&lng=${savedLng || 126.9284}&radius=5`,
      { headers: { 'X-API-KEY': AUTH_KEY } }
    );
    const text = await res.text();
    let parsed;
    try { parsed = JSON.parse(text); } catch(e) { parsed = null; }

    el.innerHTML =
      `HTTP Status: ${res.status}\nContent-Type: ${res.headers.get('content-type')}\n\n` +
      (parsed
        ? `<span class="ok">✅ JSON 파싱 성공</span>\n${JSON.stringify(parsed, null, 2)}`
        : `<span class="err">❌ JSON 파싱 실패 — raw:\n${text.substring(0, 500)}</span>`);
  } catch(e) {
    el.innerHTML = `<span class="err">❌ 네트워크 에러: ${e.message}</span>`;
  }
}

/* ④ API 직접 호출 — 내방역 사거리 좌표 고정 테스트 */
async function testAPI() {
  const el = document.getElementById('api-out');

  // 테스트 케이스 목록 (좌표, 방위각 조합)
  const tests = [
    { label: '내방역 사거리 (북향 0°)',   lat: 37.4967, lng: 126.9284, heading: 0 },
    { label: '내방역 사거리 (동향 90°)',  lat: 37.4967, lng: 126.9284, heading: 90 },
    { label: '내방역 사거리 (남향 180°)', lat: 37.4967, lng: 126.9284, heading: 180 },
    { label: '현재 GPS (북향 0°)',
      lat: savedLat || 37.4967, lng: savedLng || 126.9284, heading: 0 },
  ];

  el.innerHTML = '🌐 API 호출 중...';
  let output = '';

  for (const t of tests) {
    const url = `https://iot.klueware.com/api/v1/front-signal?lat=${t.lat}&lng=${t.lng}&heading=${t.heading}`;
    output += `\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n📍 ${t.label}\nURL: ${url}\n`;
    try {
      const res = await fetch(url, { headers: { 'X-API-KEY': AUTH_KEY } });
      const text = await res.text();
      const ct = res.headers.get('content-type') || '';
      output += `HTTP: ${res.status} | Content-Type: ${ct}\n`;
      try {
        const json = JSON.parse(text);
        output += `<span class="${res.ok ? 'ok' : 'err'}">${JSON.stringify(json, null, 2)}</span>`;
      } catch(e) {
        output += `<span class="err">❌ JSON 파싱 실패\nraw: ${text.substring(0, 300)}</span>`;
      }
    } catch(e) {
      output += `<span class="err">❌ 네트워크 에러: ${e.message}</span>`;
    }
  }
  el.innerHTML = output;
}

/* 전체 자동 실행 */
async function runAll() {
  testGPS();
  await new Promise(r => setTimeout(r, 2000)); // GPS 대기
  testKakao();
  await testCrossroadFile();
  await testAPI();
}
</script>
</body>
</html>
